# Global (place-anywhere) localization against a saved occupancy grid, in
# place of slam_toolbox_localization.yaml's fixed map_start_pose approach.
# slam_toolbox's localization mode only scan-matches within a small window
# (correlation_search_space_dimension, ~0.5m) around a pose you hand it up
# front - fine when the vehicle always re-enters the map at the same known
# point, useless if it can be placed anywhere. AMCL is a particle filter:
# with set_initial_pose false and reinitialize_global_localization called
# after startup (see closed_loop_navigate.launch.py), it scatters particles
# over the WHOLE map's free space and converges them via odometry + scan
# matches as the vehicle moves - no known starting pose required.
#
# robot_model_type is DifferentialMotionModel - nav2_amcl has no dedicated
# Ackermann/bicycle model, only Differential and Omni. This only affects how
# per-step odometry noise is distributed between translation/rotation, not
# whether localization works, and DifferentialMotionModel is the standard
# stand-in nav2 users reach for with car-like robots for this reason.
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    scan_topic: /scan
    laser_model_type: "likelihood_field"
    laser_min_range: 0.3
    laser_max_range: 20.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    lambda_short: 0.1
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05

    # Wide particle population - global localization draws these across the
    # whole free space of the map, not just around one guessed pose, so more
    # particles than a "known start" setup needs are kept until convergence.
    min_particles: 500
    max_particles: 5000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001

    set_initial_pose: false
    always_reset_initial_pose: false
    save_pose_rate: 0.5
    # Nav2 defaults - deliberately NOT relaxed to near-zero. A vehicle that
    # commits to a confident pose off a single STATIONARY scan is exactly
    # what goes wrong on a geometrically repetitive track (see
    # localization_creep.py's docstring): several spots on a symmetric loop
    # can look nearly identical from one scan, and update_min_d/a this low
    # would let AMCL lock onto one of them immediately, before real motion
    # has a chance to disambiguate. localization_creep.py (run right after
    # reinitialize_global_localization - see closed_loop_navigate.launch.py)
    # solves the "nothing moves the vehicle to trigger an update" deadlock
    # instead, by actually driving it, which is what these gates assume will
    # happen anyway in normal operation.
    update_min_a: 0.2
    update_min_d: 0.25
    tf_broadcast: true
    transform_tolerance: 1.0
